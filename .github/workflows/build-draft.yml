name: Build draft release (HyperPaletteMod)

# Builds the HyperPaletteMod APK and puts it in a DRAFT release, so nothing is published until the
# draft is opened and published by hand. Older drafts made by this workflow are replaced.
on:
  push:
    branches: ["palette-mod"]
    paths:
      - "palettemod/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-draft.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The hosted runner already has an Android SDK ($ANDROID_HOME); only the two packages this
      # project needs are added.
      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :palettemod:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          ver=$(grep -oP 'versionName\s*=\s*"\K[^"]+' palettemod/build.gradle.kts)
          name="HyperPaletteMod-${ver}-$(git rev-parse --short HEAD).apk"
          cp palettemod/build/outputs/apk/release/palettemod-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HyperPaletteMod
          path: ${{ steps.apk.outputs.name }}

      - name: Replace older drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and (.tag_name | test("^(editormod-|draft-)"))) | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Draft, testing on device.** One module for the Palette in the **Media Editor** and the **Camera**, with its own settings screen.

          **New in 0.4.2-draft:**
          - Adds a **"Compare against saved look"** toggle under Media Editor settings: when enabled, holding the Compare (before/after) button in Media Editor shows the photo's initial saved Palette look instead of reverting to the unfiltered original.
          EOF
          gh release create "draft-v${{ steps.apk.outputs.ver }}.${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.name }}" \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Draft: HyperPaletteMod ${{ steps.apk.outputs.ver }} (Media Editor + Camera)" --notes-file notes.md
