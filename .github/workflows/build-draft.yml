name: Build draft release (HyperPaletteMod)

# Builds the HyperPaletteMod APK and puts it in a DRAFT release, so nothing is published until the
# draft is opened and published by hand. Older drafts made by this workflow are replaced.
on:
  push:
    branches: ["claude/intelligent-darwin-aioit5"]
    paths:
      - "palettemod/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-draft.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The hosted runner already has an Android SDK ($ANDROID_HOME); only the two packages this
      # project needs are added.
      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon :palettemod:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          name="HyperPaletteMod-0.2.3-draft-$(git rev-parse --short HEAD).apk"
          cp palettemod/build/outputs/apk/release/palettemod-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HyperPaletteMod
          path: ${{ steps.apk.outputs.name }}

      - name: Replace older drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and (.tag_name | test("^(editormod-|draft-)"))) | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Draft, untested on a device.** One module for the Palette in the **Media Editor** and the **Camera**, with its own settings screen. It replaces the earlier HyperEditorMod draft and the re-edit step briefly added to HyperCameraMod; the original HyperCameraMod stays as it is and can be installed alongside.

          Settings (open the module's app): open the Palette pad on this phone; keep the pad's numbers on one line; add re-edit data to saved HEIC photos (off / photos taken with a filter / every photo, default: filtered); the editor filter id the data names (58).

          How to test on a 17 Ultra:
          1. Install, enable in LSPosed/Vector with **Camera** and **Media Editor** in the scope, open the module's app (it should say *Active*), then force-stop both apps.
          2. Take a photo with a filter. `adb logcat -s HyperPaletteMod` shows `hooked 2 HEIC save path(s)`, `watching ...DCIM/Camera`, then for each save which path fired and `added re-edit data ...` or why it was skipped. The new photo should be about twice its usual size.
          3. Copy the **original** photo off the phone by cable (chat apps and an iPhone strip the data). Open it in the Media Editor, pick the filter, tap the selected filter again.

          **New in 0.2.3:** a second read-only probe, on MIVIRenderTag.initParams, in case the first one never fired. Take a Chrome shot with a Palette and send `adb logcat -s HyperPaletteMod` (the whole start-up part: the lines saying `probing ...` or `cannot probe ...`, plus any `initParams tag:` / `candy(` lines). 0.2.2's Chrome record (id 142, LUT, version 2) is kept.

          The added data uses the saved photo as its own source and a neutral Palette (the pad starts at 0), because the 17 Ultra camera does not keep the unfiltered picture. Saving the camera's own filter and Palette values for true re-editing is planned, not included. See `palettemod/README.md`.
          EOF
          gh release create "draft-v0.2.3.${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.name }}" \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Draft: HyperPaletteMod 0.2.3 (Media Editor + Camera)" --notes-file notes.md
