name: Build draft release (HyperPaletteMod)

# Builds the HyperPaletteMod APK and puts it in a DRAFT release, so nothing is published until the
# draft is opened and published by hand. Older drafts made by this workflow are replaced.
on:
  push:
    branches: ["palette-mod"]
    paths:
      - "palettemod/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-draft.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The hosted runner already has an Android SDK ($ANDROID_HOME); only the two packages this
      # project needs are added.
      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon :palettemod:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          name="HyperPaletteMod-0.3.2-draft-$(git rev-parse --short HEAD).apk"
          cp palettemod/build/outputs/apk/release/palettemod-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HyperPaletteMod
          path: ${{ steps.apk.outputs.name }}

      - name: Replace older drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and (.tag_name | test("^(editormod-|draft-)"))) | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Draft, testing on device.** One module for the Palette in the **Media Editor** and the **Camera**, with its own settings screen.

          **New in 0.3.2:**
          - Hooks `n7.M.J(Application, Uri, String, ByteBuffer, ...)` — the actual `FileChannel` `ByteBuffer` writer used by MIVI3 HEIC captures on 17 Ultra — so the filtered outer HEIC + re-edit data is written directly on first save before Camera or Gallery ever sees an unfiltered file.
          EOF
          gh release create "draft-v0.3.2.${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.name }}" \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Draft: HyperPaletteMod 0.3.2 (Media Editor + Camera)" --notes-file notes.md
