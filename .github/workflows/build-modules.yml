name: Build HyperFilmFilters & HyperCameraMod

on:
  push:
    branches: ["main", "palette-mod"]
    paths:
      - "app/**"
      - "cameramod/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-modules.yml"
  workflow_dispatch:
    inputs:
      module:
        description: "Module to build"
        type: choice
        default: "all"
        options:
          - all
          - HyperFilmFilters
          - HyperCameraMod

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TARGET: ${{ inputs.module || 'all' }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "HyperFilmFilters" ]; then
            ./gradlew --no-daemon :app:assembleRelease
            VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            cp app/build/outputs/apk/release/app-release.apk "dist/HyperFilmFilters-${VER}-${SHA}.apk"
          fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "HyperCameraMod" ]; then
            ./gradlew --no-daemon :cameramod:assembleRelease
            VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' cameramod/build.gradle.kts)
            cp cameramod/build/outputs/apk/release/cameramod-release.apk "dist/HyperCameraMod-${VER}-${SHA}.apk"
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: signed-modules
          path: dist/*.apk

      - name: Replace older module drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and (.tag_name | test("^modules-draft-"))) | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "modules-draft-${GITHUB_RUN_NUMBER}" dist/*.apk \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Draft: HyperFilmFilters + HyperCameraMod (signed)" \
            --notes "Signed release APKs built from \`${GITHUB_SHA::7}\`."
