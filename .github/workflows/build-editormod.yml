name: Build HyperEditorMod (draft release)

# Builds the HyperEditorMod APK and puts it in a DRAFT release, so nothing is published until
# the draft is opened and published by hand. Older editormod drafts are replaced.
on:
  push:
    branches: ["claude/intelligent-darwin-aioit5"]
    paths:
      - "editormod/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-editormod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The hosted runner already has an Android SDK ($ANDROID_HOME); only the two packages this
      # project needs are added.
      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon :editormod:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          name="HyperEditorMod-0.1.1-draft-$(git rev-parse --short HEAD).apk"
          cp editormod/build/outputs/apk/release/editormod-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HyperEditorMod
          path: ${{ steps.apk.outputs.name }}

      - name: Replace older editormod drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and (.tag_name | startswith("editormod-"))) | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Draft, untested on a device.** Lets the Xiaomi Media Editor (`com.miui.mediaeditor`) open its Palette pad (Saturation and Tone) on a phone that is not in the editor's built-in device list (the 18 series: `madrid`, `venice`, `hongkong`).

          How to test on a 17 Ultra:
          1. Install the APK, enable it in LSPosed/Vector, scope **Media Editor** only.
          2. `adb shell am force-stop com.miui.mediaeditor`
          3. Open an **original** 18 Pro Palette photo (copied by cable or file manager), pick its filter, tap the selected filter again.
          4. `adb logcat -s HyperEditorMod` should show `Palette device list [madrid, venice, hongkong] -> [nezha, venice, hongkong]`.

          0.1.1 also widens the Saturation and Tone numbers above the pad, which wrapped onto two lines.

          It only removes the device check. The pad needs the photo's own re-edit data, which the 18 Pro camera writes and the 17 Ultra camera does not. See `editormod/README.md`.
          EOF
          gh release create "editormod-v0.1.1-draft.${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.name }}" \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "HyperEditorMod 0.1.1 (draft)" --notes-file notes.md
